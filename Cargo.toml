[package]
name = "kuva"
version = "0.5.0"
edition = "2021"
rust-version = "1.87"
description = "Scientific plotting library in Rust with various backends."
authors = ["James M. Ferguson <j.ferguson@garvan.org.au>"]
repository = "https://github.com/Psy-Fer/kuva"
license = "MIT"
keywords = ["plotting", "bioinformatics", "svg", "visualization", "science"]
categories = ["science", "visualization", "graphics", "command-line-utilities"]
documentation = "https://docs.rs/kuva"
readme = "README.md"
# Only the gzip-compressed .ttf.gz files are needed at compile time (include_bytes!).
# The raw .ttf files, the mdBook documentation tree, generated example outputs,
# and helper scripts are excluded to stay within the crates.io 10 MB limit.
exclude = [
    "assets/fonts/*.ttf",           # raw TTFs — only .ttf.gz are used by include_bytes!
    "assets/fonts/*.otf",           # raw OTFs (NewCM Math) — only .otf.gz is embedded
    "docs/",                         # mdBook source + generated SVG/PNG/GIF/PDF assets
    "scripts/",                      # smoke test and generation scripts
    "examples/*.svg",                # generated SVG outputs
    "examples/*.png",                # generated PNG outputs
    "examples/data/gene_stats.tsv",  # large TSV (~500 KB) only used in smoke tests
    "examples/data/gene_stats_logp.tsv",
]

[package.metadata.docs.rs]
all-features = true

[package.metadata.msrv]
# The `pdf` feature's real minimum Rust version — higher than `package.rust-version`
# above, which intentionally excludes it (see README.md's note and CHANGELOG.md).
# krilla (the `pdf` feature's PDF backend) sets this floor; bump it in lockstep
# with krilla's own MSRV. typst (the feature's math typesetter) also rides this
# floor but currently needs less (1.89 as of typst 0.14). Read by
# .github/workflows/ci.yml's `pdf-msrv` job so CI actually verifies
# `--features cli,full` builds at *this* version, not at
# `package.rust-version` (which is no longer sufficient for that feature combo).
pdf_feature = "1.92"

[features]
default    = []
png        = ["dep:fontdue", "dep:png", "dep:flate2"]
# svg2pdf (the previous pdf backend) was archived upstream by its own
# maintainer in favour of krilla/krilla-svg (same author) — see CHANGELOG.md.
# krilla-svg 0.8.x requires Rust 1.92; this is *not* reflected in the crate's
# own `rust-version` (kept at 1.87) since that field is crate-wide and would
# otherwise force every kuva user — even ones who never enable `pdf` — onto
# a newer MSRV via Cargo's rust-version-aware resolver. Building with
# `--features pdf` (or `full`) genuinely requires Rust >= 1.92; documented in
# README/CHANGELOG rather than enforced through Cargo metadata.
#
# `pdf` also carries the in-process math typesetter (the "typst tier"): each
# label containing `$...$` is typeset by the Typst compiler (linked as a
# library) and embedded in SVG/PNG/PDF output — real math typography (proper
# italic σ, vinculum √, stacked fractions, sums) with no external typst CLI.
# It rides `pdf` rather than being its own feature because krilla *is* Typst's
# PDF stack — this is the one deliberately heavy, higher-MSRV feature, and
# splitting it in two bought nothing but combinatorics. Builds without `pdf`
# lower `$...$` to inline Unicode via the always-on lookup tier instead.
pdf        = [
    "dep:krilla",
    "dep:krilla-svg",
    "dep:usvg",
    "dep:flate2",
    "dep:typst",
    "dep:typst-svg",
    "dep:typst-render",
    "dep:typst-library",
]
embed_font = ["dep:flate2"]
cli        = ["dep:clap", "dep:clap_mangen", "dep:csv"]
full       = ["embed_font", "png", "pdf", "typst"]
parquet    = ["cli", "dep:parquet", "dep:bytes", "dep:arrow-array", "dep:arrow-schema"]
# Typst markup output backend. Emits .typ source the user compiles externally
# with `typst compile fig.typ` — pure string emission, no deps. The TypstBackend
# itself handles `$...$` math via native Typst math syntax. Upstream issue #16.
typst      = []
# Adds `kuva doom` subcommand and generates a self-contained DOOM SVG.
# Build downloads doom.wasm + doom1.wad from the kuva doom-assets release.
# Run once: cargo build --bin kuva --features cli,doom
doom = ["cli"]
# Adds `--emit-code` to every subcommand: prints the equivalent Rust library
# code for the plot instead of rendering it. CLI-only, no extra dependencies,
# gated separately so minimal CLI builds can skip it.
emit_code = ["cli"]

[dependencies]
bytes = { version = "1", optional = true }
colorous = "=1.0.16"
chrono = { version = "0.4", default-features = false, features = ["std"] }
ryu = "1"
flate2      = { version = "1", optional = true }
fontdue     = { version = "0.9",  optional = true }
png         = { version = "0.18", optional = true }
parquet      = { version = "59.2", features = ["arrow"], optional = true }
arrow-array  = { version = "59.2", optional = true }
arrow-schema = { version = "59.2", optional = true }
krilla      = { version = "0.8", optional = true }
krilla-svg  = { version = "0.8", optional = true }
# Parses kuva's own SVG output into a usvg::Tree for krilla-svg's `draw_svg`.
# Pinned to the exact minor version krilla-svg 0.8.x itself depends on, since
# `usvg::Tree`/`usvg::Options` are part of krilla-svg's public API surface —
# an incompatible bump here would fail to type-check against krilla-svg.
usvg        = { version = "=0.47.0", optional = true }
clap        = { version = "4", features = ["derive"], optional = true }
clap_mangen = { version = "0.2", optional = true }
csv         = { version = "1", optional = true }
typst         = { version = "0.14", optional = true }
typst-svg     = { version = "0.14", optional = true }
typst-render  = { version = "0.14", optional = true }
typst-library = { version = "0.14", optional = true }

[dev-dependencies]
rand = "0.9.3"
rand_distr = "0.5.1"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
image = "0.24"
# Used only by the `gen_text_metrics` example and the text_metrics drift-guard
# test to read advance widths from the bundled TTFs. Not a runtime dependency:
# the advances ship as a precompiled const table in src/render/text_metrics/data.rs.
ttf-parser = "0.25"
# Used only by the `--emit-code` compile-check test: confirms emitted snippets
# actually compile against the real kuva crate, not just "look right".
trybuild = "1"

[[bench]]
name = "render"
harness = false

[[bench]]
name = "kde"
harness = false

[[bench]]
name = "svg"
harness = false

[[bin]]
name = "kuva"
path = "src/bin/kuva/main.rs"
required-features = ["cli"]

[[example]]
name = "figure"

[[example]]
name = "all_plots_simple"

[[example]]
name = "all_plots_complex"
required-features = ["png"]
