name: Release

# Build standalone `kuva` CLI binaries on every version tag and attach them to the
# matching GitHub Release, so users can download a pre-compiled binary instead of
# building from source. Resolves https://github.com/Psy-Fer/kuva/issues/17.

on:
  push:
    tags:
      # Matches the existing release-tag convention (v0.1.6, v0.2.0, ...).
      - "v[0-9]+.[0-9]+.[0-9]+"
  # Manual runs: pick/enter an existing tag to (re)build and attach binaries for.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and release (e.g. v0.2.0)"
        required: true

# Read-only by default. Only `create-release` and `publish` get write access, and
# neither runs build code or third-party actions other than GitHub's own, so nothing
# that runs during compilation (actions, toolchain setup, dependency build scripts)
# holds a token that can change releases or the repository.
#
# Every action is pinned to a full commit SHA (version in the trailing comment), so
# moving an upstream tag cannot change what a release run executes. To update one,
# look up the new tag's commit (`git ls-remote --tags https://github.com/OWNER/REPO`)
# and replace both the SHA and the comment.
permissions:
  contents: read

jobs:
  # `gh release upload` in `publish` needs an *existing* Release; a tag push
  # alone does not create one. Create it first (idempotently) so there is
  # somewhere to attach the binaries.
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release if it does not exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "$TAG" --generate-notes

  # Builds and packs each binary with no write access. The archives go to the
  # `publish` job as workflow artifacts.
  build:
    needs: create-release
    name: ${{ matrix.target }}${{ matrix.variant.suffix }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Don't let one failing target cancel the others — a partial set of
      # binaries is still useful, and lets us see which target actually broke.
      fail-fast: false
      matrix:
        # Two builds per target.
        #
        # The default-named asset is the lean one: every feature that a
        # downloaded binary has no way to opt into later, minus the one that
        # dominates the download size. `emit_code` (`--emit-code` on every
        # subcommand) and `parquet` (`.parquet` input) are both out of `full`
        # but cost ~0.1 MB and ~2.3 MB respectively, so they belong here.
        #
        # `typst-math` typesets `$...$` labels with the Typst compiler linked
        # in as a library. That is a ~200-crate tree and adds ~12 MB of .text
        # plus ~7.7 MB of .rodata: it takes the archive from ~8 MB to ~20 MB
        # on its own. LTO and codegen-units=1 were measured and recover none
        # of it, so the only lever is shipping it separately. People who want
        # typeset math take the `-typst` asset; everyone else gets a download
        # a third of the size with the Unicode lowering tier still in place.
        #
        # `doom` is intentionally excluded from both — it downloads assets at
        # build time. `typst` (the .typ markup backend) is excluded because it
        # is library-only: the CLI's output dispatch accepts .svg/.png/.pdf
        # and never emits .typ, so enabling it in a binary changes nothing.
        variant:
          - suffix: ""
            features: cli,full,emit_code,parquet
          - suffix: "-typst"
            features: cli,full,emit_code,parquet,typst-math
        target:
          - x86_64-unknown-linux-gnu
          # Static musl build: runs on any Linux distro without a glibc match.
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-gnu
          # Both macOS targets build on the Apple-Silicon runner: it cross-compiles
          # to x86_64 natively (no extra tooling). The Intel macos-13 runner is
          # scarce/deprecated and can queue indefinitely on personal accounts.
          - x86_64-apple-darwin
          - aarch64-apple-darwin
          - x86_64-pc-windows-msvc
        # Runner per target. Each entry matches on `target` alone, so it adds
        # `os` to *both* of that target's variant combinations rather than
        # creating new ones.
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          # Don't leave the token in .git/config for the rest of the job.
          persist-credentials: false

      # Cross-compiles where needed (musl tooling, `cross` for aarch64-linux),
      # builds a release binary, packs it into an archive named below and writes
      # a SHA-256 checksum next to it in the workspace. `dry-run` means the action
      # gets no token and uploads nothing; `publish` does the upload.
      - name: Build kuva binary
        id: build
        uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1.30.2
        with:
          bin: kuva
          features: ${{ matrix.variant.features }}
          target: ${{ matrix.target }}
          # Fail instead of re-resolving dependencies when Cargo.lock is stale.
          locked: true
          # Asset name, e.g. kuva-v0.2.0-x86_64-unknown-linux-gnu.tar.gz for
          # the lean build and kuva-v0.2.0-x86_64-unknown-linux-gnu-typst.tar.gz
          # for the math one (.zip on Windows).
          archive: kuva-$tag-$target${{ matrix.variant.suffix }}
          checksum: sha256
          # On manual runs there is no tag ref; tell the action which tag to use.
          # On tag pushes this is empty and the action falls back to github.ref.
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || '' }}
          dry-run: true
          dry-run-intended: true

      # The archive (.tar.gz or .zip) and its .sha256 file.
      - name: Keep the archive for publishing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kuva-${{ matrix.target }}${{ matrix.variant.suffix }}
          path: ${{ steps.build.outputs.archive }}.*
          if-no-files-found: error
          # Long enough to re-run a failed `publish` without rebuilding.
          retention-days: 7

  # Attaches the built archives to the Release, with a signed build-provenance
  # attestation for each one. The attestation is made here, not by the build step,
  # and ties each file to this workflow and commit; check a download with
  # `gh attestation verify <file> --repo Psy-Fer/kuva`.
  publish:
    needs: [create-release, build]
    # Like `fail-fast: false` above: publish whichever targets built, so a single
    # broken target doesn't hold back the rest.
    if: ${{ !cancelled() && needs.create-release.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: kuva-*
          path: dist
          merge-multiple: true

      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip

      # `--clobber` replaces same-named assets, so re-running over an existing tag
      # updates them in place.
      - name: Upload to the Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: gh release upload "$TAG" dist/* --clobber
